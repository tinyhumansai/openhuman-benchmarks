# Cross-harness benchmark rig. See README.md.
#
#   docker compose up -d meter-proxy            # metering proxy (holds the real key)
#   node orchestrate.mjs --harness openhuman --suite micro
#
# Every harness runs through the `task` service below, so CPU/RAM limits, the
# network, the proxy and the credential handling are identical by construction.
# Only the harness bundle mounted at /opt/harness differs.

name: harness-bench

networks:
  # Task containers sit on an internal network: no route out, only the meter
  # proxy. Without this, agents fetched the benchmark's own reference solutions
  # (DeepSWE solution.patch from Hugging Face / GitHub mirrors) and applied them.
  # BENCH_NET_INTERNAL=false reopens it; use that only to debug.
  bench:
    driver: bridge
    internal: ${BENCH_NET_INTERNAL:-true}
  # The proxy alone reaches the upstream API.
  egress:
    driver: bridge

services:
  # The only holder of the real OpenRouter key. Pins model + reasoning effort on
  # every request and appends one JSONL record per inference call.
  meter-proxy:
    build:
      context: ./meter-proxy
    user: "${BENCH_UID:-1000}:${BENCH_GID:-1000}" # results/ stays owned by the invoking user
    cpus: 1 # the proxy only forwards and hashes; keep it off the harness's CPU budget
    mem_limit: 512m
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY (env or .env)}
      BENCH_MODEL: ${BENCH_MODEL:-deepseek/deepseek-v4.1-flash}
      BENCH_REASONING: ${BENCH_REASONING:-high}
      BENCH_PROVIDER: ${BENCH_PROVIDER:-DeepSeek} # pinned, no fallbacks; empty = let OpenRouter route
      METER_LOG: /results/meter.jsonl
      # Harbor task containers reach the proxy through this socket (tbench/run.mjs mounts the
      # directory), so the bench never adds networks to a task Harbor owns.
      METER_SOCKET: /sock/meter.sock
    volumes:
      - ./results:/results
      - ./.cache/meter-sock/${COMPOSE_PROJECT_NAME:-harness-bench}:/sock
    ports:
      - "127.0.0.1:${METER_HOST_PORT:-18080}:8080" # control plane for the orchestrator
    networks: [bench, egress]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/__bench/health"]
      interval: 2s
      timeout: 2s
      retries: 20

  # One task, one harness, one fresh container. `image` is the task's own image
  # (an official SWE-bench instance image, or bench-micro); the harness itself is
  # a bundle built under bundles/ and bind-mounted read-only, so the task image
  # never has to know which harness is running.
  task:
    profiles: ["task"]
    image: ${TASK_IMAGE:-unset}
    entrypoint: ["/opt/harness/node/bin/node", "/opt/bench/runner/entry.mjs"]
    cpus: ${BENCH_CPUS:-4}
    mem_limit: ${BENCH_MEM:-8g}
    memswap_limit: ${BENCH_MEM:-8g} # no swap: RAM is a hard, comparable ceiling
    pids_limit: 4096
    working_dir: ${WORKDIR:-/testbed}
    depends_on:
      meter-proxy:
        condition: service_healthy
    networks: [bench]
    environment:
      BENCH_HARNESS: ${HARNESS:-unset}
      BENCH_TASK_ID: ${TASK_ID:-unset}
      WORKDIR: ${WORKDIR:-/testbed}
      TASK_TIMEOUT_S: ${TASK_TIMEOUT_S:-1800}
      RESULT_DIR: /results
      PROMPT_FILE: /bench/task/prompt.txt
      # Harnesses only ever see the proxy and a dummy credential.
      PROXY_URL: http://meter-proxy:8080
      BENCH_MODEL: ${BENCH_MODEL:-deepseek/deepseek-v4.1-flash}
      BENCH_REASONING: ${BENCH_REASONING:-high}
      DUMMY_API_KEY: bench-dummy-key
      # Bench-only harness knobs, empty unless a run sets them.
      OPENHUMAN_COMPACTION_TRIGGER_TOKENS: ${OPENHUMAN_COMPACTION_TRIGGER_TOKENS:-}
      OPENHUMAN_AGENT_TURN_TIMEOUT_SECS: ${OPENHUMAN_AGENT_TURN_TIMEOUT_SECS:-}
      BENCH_TURN_MARGIN_S: ${BENCH_TURN_MARGIN_S:-}
      # No telemetry / update checks from any harness.
      DISABLE_TELEMETRY: "1"
      DISABLE_AUTOUPDATER: "1"
      DO_NOT_TRACK: "1"
      CI: "1"
    volumes:
      - ./.cache/harness/${HARNESS}:/opt/harness:ro
      - ./runner:/opt/bench/runner:ro
      - ${TASK_DIR:-./tasks}:/bench/task:ro
      - ./results/${RUN_ID:-dev}/${HARNESS}/${TASK_ID}:/results

  # Task image for the micro suite (fixed, tiny, no per-task env). Same Ubuntu
  # release as the SWE-bench instance images so one harness bundle runs in both.
  micro-image:
    profiles: ["build"]
    image: bench-micro:latest
    build:
      context: ./micro
