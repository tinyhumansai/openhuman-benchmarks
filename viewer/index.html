<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harness bench viewer</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--line:#ddd;--card:#f6f6f6;--acc:#0a5fd6;--bad:#c0392b;--ok:#1e8449}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--fg:#e8e8e8;--mut:#999;--line:#333;--card:#1f1f1f;--acc:#6aa8ff;--bad:#ff7b6b;--ok:#5fd18a}}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:16px}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
h1{font-size:18px;margin:0 0 4px}h2{font-size:15px;margin:20px 0 8px}
.crumbs{color:var(--mut);margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,td.l,th.l{text-align:left}
th{color:var(--mut);font-weight:500}
.wrap{overflow-x:auto}
pre{background:var(--card);border:1px solid var(--line);padding:10px;overflow:auto;max-height:560px;white-space:pre-wrap;word-break:break-word;margin:6px 0}
.tag{display:inline-block;padding:0 6px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-size:12px;margin-right:4px}
.bad{color:var(--bad)}.ok{color:var(--ok)}.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.card{background:var(--card);border:1px solid var(--line);padding:10px;border-radius:6px}
.md h1,.md h2,.md h3,.md h4{margin:16px 0 6px}.md h1{font-size:17px}.md h2{font-size:15px}.md h3{font-size:14px}.md h4{font-size:13px;color:var(--mut)}
.md p{margin:6px 0}.md ul{margin:6px 0;padding-left:22px}.md code{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:12.5px}
.md pre{margin:6px 0;max-height:320px;position:relative}.md pre code{background:none;border:0;padding:0}.md .lang{position:absolute;top:2px;right:8px;color:var(--mut);font-size:11px}
.tabs button{margin-right:4px}.tabs button.on{font-weight:600;outline:2px solid var(--acc)}
details{margin:6px 0}summary{cursor:pointer}
.role{font-weight:600;text-transform:uppercase;font-size:12px;color:var(--mut)}
</style>
</head>
<body><main id="app"></main>
<script>
// Everything from results/ is untrusted text (prompts, model output): it only ever
// reaches the DOM through textContent, never innerHTML.
const app = document.getElementById("app");
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
};
const api = async (p) => { const r = await fetch(p); if (!r.ok) throw new Error(`${p}: ${r.status}`); return r.json(); };
const e = encodeURIComponent;
// Rough token estimate for text sizes (chars / 3); the table's measured o200k counts stay as they are.
const estTok = (chars) => (chars == null ? null : Math.round(chars / 3));
const pct = (a, b) => (a == null || !b ? "–" : `${((100 * a) / b).toFixed(1)}%`);
const fmt = (n, d = 0) => n == null ? "–" : Number(n).toLocaleString(undefined, { maximumFractionDigits: d });
const link = (href, text) => h("a", { href }, text);
const crumbs = (...parts) => h("div", { class: "crumbs" }, parts.flatMap((p, i) => i ? [" / ", p] : [p]));
const table = (heads, rows) => h("div", { class: "wrap" }, h("table", {},
  h("tr", {}, heads.map((x, i) => h("th", { class: i ? "" : "l" }, x))),
  rows.map((r) => h("tr", {}, r.map((c) => h("td", {}, c))))));
const pre = (text) => h("pre", {}, typeof text === "string" ? text : JSON.stringify(text, null, 2));

async function runs() {
  const mine = nav;
  const list = await api("/api/runs");
  if (mine === nav) app.replaceChildren(h("h1", {}, "Runs"), crumbs("runs"),
    table(["run", "harnesses", "captured"], list.map((r) => [
      link(`#/run/${e(r.run)}`, r.run), r.harnesses.join(", "), r.captured.join(", ") || h("span", { class: "mut" }, "none"),
    ])));
}

// Render summary.md's pipe tables as tables and everything else as text (still textContent only).
function mdView(md) {
  const out = h("div", {});
  let rows = [];
  const flush = () => {
    if (!rows.length) return;
    const [head, , ...body] = rows;
    out.append(table(head, body));
    rows = [];
  };
  for (const line of md.split("\n")) {
    if (line.startsWith("|")) rows.push(line.split("|").slice(1, -1).map((c) => c.trim()));
    else {
      flush();
      if (line.trim()) out.append(h(line.startsWith("#") ? "h2" : "p", { class: line.startsWith("#") ? "" : "mut" }, line.replace(/^#+\s*/, "")));
    }
  }
  flush();
  return out;
}

async function run(id) {
  const mine = nav;
  const d = await api(`/api/runs/${e(id)}`);
  const kids = [h("h1", {}, id), crumbs(link("#/", "runs"), id), h("h2", {}, "Harnesses (from the meter proxy, on the wire)")];
  kids.push(table(
    ["harness", "tasks", "turns", "prompt tok", "completion tok", "cached %", "cost $", "system tok", "tool schema tok", "tools", "errors", "overridden", "system prompt (est.)"],
    d.harnesses.map((x) => [
      x.harness, x.tasks, x.calls, fmt(x.prompt_tokens), fmt(x.completion_tokens), fmt(x.cache_pct, 1), fmt(x.cost_usd, 4),
      fmt(x.system_prompt_tokens), fmt(x.tool_schema_tokens), fmt(x.tool_count),
      x.errors ? h("span", { class: "bad" }, x.errors) : 0, x.overridden,
      x.sample_task ? link(`#/call/${e(id)}/${e(x.harness)}/${e(x.sample_task)}/${x.sample_seq}`, `~${fmt(estTok(x.system_chars))} tokens`) : "–",
    ])));
  const withTasks = d.harnesses.filter((x) => x.sample_task);
  if (withTasks.length) {
    kids.push(h("h2", {}, "Tasks"));
    const grid = h("div", { class: "grid" });
    for (const x of withTasks) {
      const tasks = await api(`/api/runs/${e(id)}/tasks/${e(x.harness)}`);
      grid.append(h("div", { class: "card" }, h("b", {}, x.harness), h("div", {},
        tasks.map((t) => h("div", {}, link(`#/task/${e(id)}/${e(x.harness)}/${e(t.task)}`, t.task), h("span", { class: "mut" }, ` ${t.calls} ${t.calls === 1 ? "turn" : "turns"}`))))));
    }
    kids.push(grid);
  } else kids.push(h("p", { class: "mut" }, "No request captures for this run (it predates capture, or METER_CAPTURE=0)."));
  if (d.summary_md) kids.push(h("h2", {}, "Summary"), mdView(d.summary_md));
  if (mine === nav) app.replaceChildren(...kids);
}

async function task(id, harness, t) {
  const mine = nav;
  const calls = await api(`/api/runs/${e(id)}/calls/${e(harness)}/${e(t)}`);
  const flag = (v) => v === null ? "" : v ? h("span", { class: "ok" }, "same") : h("span", { class: "bad" }, "CHANGED");
  if (mine === nav) app.replaceChildren(h("h1", {}, `${harness} · ${t}`),
    crumbs(link("#/", "runs"), link(`#/run/${e(id)}`, id), harness, t),
    h("h2", {}, "Full task transcript (Markdown)"),
    transcriptBox(`/api/runs/${e(id)}/transcript/${e(harness)}/${e(t)}/last`),
    h("p", { class: "mut" }, "A turn is one request to the model and its response; a task is made of several. ‘prefix reused’ is how many of the previous call’s messages this call re-sent byte-for-byte; below the previous count, history was rewritten and provider prefix caching is lost from there."),
    table(["turn", "status", "messages", "prefix reused", "system", "tools", "cache ctl", "prompt tok", "cached tok", "cached %", "completion", "first token ms", "total ms", "cost $", "req KB"],
      calls.map((c, i) => [
        link(`#/call/${e(id)}/${e(harness)}/${e(t)}/${c.seq}`, i + 1), c.status ?? "–", c.messages,
        c.prefix_reused_messages == null ? "–" : `${c.prefix_reused_messages}/${c.prev_messages}`,
        flag(c.same_system_as_prev), flag(c.same_tools_as_prev), c.cache_control_markers,
        fmt(c.usage?.prompt_tokens), fmt(c.usage?.cached_tokens), pct(c.usage?.cached_tokens, c.usage?.prompt_tokens), fmt(c.usage?.completion_tokens),
        fmt(c.first_token_ms ?? c.ttfb_ms), fmt(c.total_ms), fmt(c.cost_usd, 5), fmt(c.request_bytes / 1024, 1),
      ])));
}

const text = (c) => typeof c === "string" ? c : Array.isArray(c) ? c.map((p) => p?.text ?? p?.content ?? JSON.stringify(p)).join("\n") : JSON.stringify(c, null, 2);

// A small, safe Markdown renderer for the transcripts: headings, bullets, tables, paragraphs,
// `code`, **bold** and fenced blocks. It builds DOM nodes from text only (no innerHTML, no links,
// no images), so prompts and model output can never inject markup or load anything.
function inline(text) {
  return text.split(/(`[^`]+`|\*\*[^*]+\*\*)/).filter(Boolean).map((p) =>
    p.startsWith("`") && p.length > 2 ? h("code", {}, p.slice(1, -1))
      : p.startsWith("**") && p.length > 4 ? h("strong", {}, p.slice(2, -2)) : p);
}
function renderMarkdown(src) {
  const out = h("div", { class: "md" });
  const lines = src.split("\n");
  let para = [], list = null, rows = [];
  const flush = () => {
    if (para.length) out.append(h("p", {}, inline(para.join(" ")))); para = [];
    if (list) out.append(list); list = null;
    if (rows.length) { const [head, , ...body] = rows; out.append(table(head, body.map((r) => r.map(inline)))); rows = []; }
  };
  for (let i = 0; i < lines.length; i += 1) {
    const line = lines[i];
    const fenceOpen = line.match(/^(`{3,})(.*)$/);
    if (fenceOpen) {
      flush();
      const body = [];
      for (i += 1; i < lines.length && lines[i].trim() !== fenceOpen[1]; i += 1) body.push(lines[i]);
      const lang = fenceOpen[2].trim();
      out.append(h("pre", {}, lang ? h("span", { class: "lang" }, lang) : null, h("code", {}, body.join("\n"))));
      continue;
    }
    const head = line.match(/^(#{1,6})\s+(.*)$/);
    if (head) { flush(); out.append(h(`h${Math.min(head[1].length, 4)}`, {}, inline(head[2]))); continue; }
    if (line.startsWith("|")) { if (para.length || list) flush(); rows.push(line.split("|").slice(1, -1).map((c) => c.trim())); continue; }
    const li = line.match(/^\s*[-*]\s+(.*)$/);
    if (li) { if (para.length || rows.length) flush(); (list ??= h("ul", {})).append(h("li", {}, inline(li[1]))); continue; }
    if (!line.trim()) { flush(); continue; }
    if (list) flush();
    para.push(line.trim());
  }
  flush();
  return out;
}

// Collapsed by default (it can be large); loads on first open. Rendered Markdown by default, with
// the exact Markdown source one click away; Copy and "open as .md" use the same source text.
function transcriptBox(apiPath) {
  const d = h("details", {}, h("summary", {}, "Show exactly what the provider received and returned"));
  const holder = h("div", {});
  d.append(holder);
  d.addEventListener("toggle", async () => {
    if (!d.open || holder.childNodes.length) return;
    const { markdown } = await api(apiPath);
    const view = h("div", {});
    const show = (mode) => {
      view.replaceChildren(mode === "rendered" ? renderMarkdown(markdown) : pre(markdown));
      rendered.className = mode === "rendered" ? "on" : "";
      source.className = mode === "source" ? "on" : "";
    };
    const rendered = h("button", {}, "Rendered");
    const source = h("button", {}, "Markdown");
    const copy = h("button", {}, "Copy markdown");
    rendered.onclick = () => show("rendered");
    source.onclick = () => show("source");
    copy.onclick = () => navigator.clipboard.writeText(markdown).then(() => { copy.textContent = "Copied"; });
    holder.append(h("div", { class: "tabs" }, rendered, source, copy, " ", h("a", { href: `${apiPath}?format=md`, target: "_blank" }, "open as .md")), view);
    show("rendered");
  });
  return d;
}

async function call(id, harness, t, seq) {
  const mine = nav;
  const c = await api(`/api/runs/${e(id)}/call/${e(harness)}/${e(t)}/${seq}`);
  const kids = [h("h1", {}, `${harness} · ${t} · turn ${seq}`),
    crumbs(link("#/", "runs"), link(`#/run/${e(id)}`, id), link(`#/task/${e(id)}/${e(harness)}/${e(t)}`, `${harness}/${t}`), `turn ${seq}`),
    h("div", {}, [["format", c.format], ["status", c.status], ["messages", c.message_shas.length], ["tools", c.tool_count],
      ["cache_control markers", c.cache_control_markers], ["prompt_cache_key", c.prompt_cache_key]].map(([k, v]) => h("span", { class: "tag" }, `${k}: ${v ?? "–"}`))),
    h("h2", {}, "Raw transcript (Markdown)"),
    transcriptBox(`/api/runs/${e(id)}/transcript/${e(harness)}/${e(t)}/${seq}`),
    h("h2", {}, `System prompt (~${fmt(estTok(c.system_chars))} tokens est. from ${fmt(c.system_chars)} chars ÷ 3)`), pre(c.system || "(no system prompt)"),
    h("h2", {}, "Sampling & provider params"), pre(c.params),
    h("h2", {}, "Request headers"), pre(c.headers),
    h("h2", {}, `Tools (${c.tool_count})`),
    h("details", {}, h("summary", {}, c.tool_names.join(", ") || "none"), pre(c.tools)),
    h("h2", {}, `Conversation (${c.messages.length})`)];
  for (const m of c.messages) {
    kids.push(h("details", {}, h("summary", {}, h("span", { class: "role" }, m.role ?? m.type ?? "?"), " ", text(m.content ?? m.output ?? m.arguments ?? "").slice(0, 100).replace(/\s+/g, " ")), pre(m)));
  }
  kids.push(h("h2", {}, "Response (raw, as returned by the provider)"), pre(c.response ?? ""));
  if (mine === nav) app.replaceChildren(...kids);
}

let nav = 0;
async function route() {
  nav += 1;
  const [, kind, ...p] = location.hash.split("/").map(decodeURIComponent);
  try {
    if (kind === "run") await run(p[0]);
    else if (kind === "task") await task(...p);
    else if (kind === "call") await call(...p);
    else await runs();
  } catch (err) {
    app.replaceChildren(h("p", { class: "bad" }, String(err.message)), link("#/", "back"));
  }
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
